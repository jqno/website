{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ range .Paginator.Pages }}
    <section>
      <h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
      {{ with .Description }}
        <p class="description">{{ . }}</p>
      {{ end }}
    </section>
  {{ end }}
  {{ partial "pagination.html" . }}
{{ end }}
