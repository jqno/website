{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul>
    {{ range .Paginator.Pages }}
      <li>
        <a class="post-title" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        {{ with .Description }}
          <p class="description">{{ . }}</p>
        {{ end }}
      </li>
    {{ end }}
  </ul>
  {{ partial "pagination.html" . }}
{{ end }}
