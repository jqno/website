{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul>
    {{ range .Pages.ByTitle }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
        <span class="term-count">({{ len .Pages }})</span>
      </li>
    {{ end }}
  </ul>
{{ end }}
